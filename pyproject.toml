[project]
name = "cnas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush Paliwal", email = "ayushpaliwal1920@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.7",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.2",
    "neo4j>=6.2.0",
    "networkx>=3.6.1",
    "node2vec>=0.4.3",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pinecone>=7.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "python-louvain>=0.16",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sentence-transformers>=6.0.0",
    "setuptools<81",
    "spacy>=3.8.16",
    "uvicorn>=0.52.4",
    "web3>=7.16.0",
]

[project.scripts]
cnas = "cnas:main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that require external services such as Neo4j or Pinecone",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
